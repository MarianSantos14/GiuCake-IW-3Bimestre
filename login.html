<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <style>
        .fundoLogin {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .faixa {
            flex: 1;
            /* cada faixa ocupa 1/3 */
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .faixa img {
            opacity: 0.25;
            /* deixa bem clarinho no fundo */
        }

        .cor1>img,
        .cor3>img {
            display: block;
            translate: -80px 0;
        }

        .cor2>img {
            display: block;
            translate: 80px 0;
        }

        .cor1,
        .cor2,
        .cor3 {
            display: block;
            height: 33.33%;
            display: flex;
            justify-content: end;
        }

        .cor1 {
            background: #FCCCD8;

        }

        .cor2 {
            background: #FFEBF0;
            justify-content: start;
        }

        .cor3 {
            background: #FFF7F9;
        }

        .login-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 1200px;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
            padding: 40px;
            text-align: center;
            z-index: 10;
            width: 50%;
            height: 90vh;
        }

        .titulo {
            color: #d42d66;
            font-weight: 600;
            display: none;
        }

        .tituloForm {
            color: #d42d66;
            font-weight: 600;
        }

        @media screen and (max-width: 768px) {

            .cor1>img,
            .cor2>img,
            .cor3>img {
                display: none;
            }

            .login-card {
                width: 100%;
                padding: 20px;
                position: static;
                top: 0;
                left: 0;
                transform: translate(0, 0);
                max-width: 100%;
                border-radius: 0;
            }

            .tituloForm {
                display: block;
            }
        }

        @media screen and (max-width: 992px) {
            .titulo {
                display: block;
            }

            .tituloForm {
                display: none;
            }
        }
    </style>
</head>

    <div class="fundoLogin">
        <!-- 3 faixas de fundo -->
        <div class="faixa cor1">
            <img src="img/donut.png" alt="Cookie" style="width: 200px;">
        </div>
        <div class="faixa cor2">
            <img src="img/cookie.png" alt="Donut" style="width: 200px;">
        </div>
        <div class="faixa cor3">
            <img src="img/cupcake.png" alt="Cupcake" style="width: 200px;">
        </div>

        <!-- Card central -->
        <div class="login-card">
            <h2 class="tituloForm mb-4">LOGIN</h2>
            <form>
                <div class="row g-3">
                    <div class="col-12 col-sm-6 col-md-6">
                        <input type="text" class="form-control" placeholder="nome">
                    </div>
                    <div class="col-12 col-sm-6 col-md-6">
                        <input type="text" class="form-control" placeholder="sobrenome">
                    </div>
                </div>

                <div class="row g-3 mt-2">
                    <div class="col-12 col-sm-2 col-md-2">
                        <input type="number" class="form-control" placeholder="idade">
                    </div>
                    <div class="col-12 col-sm-5 col-md-5">
                        <input type="email" class="form-control" placeholder="email">
                    </div>
                    <div class="col-12 col-sm-5 col-md-5">
                        <input type="text" class="form-control" placeholder="cpf">
                    </div>
                </div>
                <div class="row g-3 mt-2">
                    <div class="col-12 col-sm-8 col-md-6">
                        <input type="text" class="form-control" placeholder="rua">
                    </div>
                    <div class="col-12 col-sm-4 col-md-6">
                        <input type="text" class="form-control" placeholder="cep">
                    </div>
                </div>
                <div class="row g-3 mt-2">
                    <div class="col-12 col-sm-4 col-md-4">
                        <input type="text" class="form-control" placeholder="pais">
                    </div>
                    <div class="col-12 col-sm-4 col-md-4">
                        <input type="text" class="form-control" placeholder="estado">
                    </div>
                    <div class="col-12 col-sm-4 col-md-4">
                        <input type="text" class="form-control" placeholder="cidade">
                    </div>
                </div>
                <button type="submit" class="btn btn-danger btn-destaque px-4 mt-4">Entrar</button>
            </form>
        </div>
    </div>
