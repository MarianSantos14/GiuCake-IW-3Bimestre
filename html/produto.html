<!DOCTYPE html>
<html lang="Pt-Br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GiuCake | Produto</title>
    <link rel="icon" href="../img/icon.svg" type="image/x-icon">

    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">

    <link rel="stylesheet" href="../css/global.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container w-100">
                <a class="navbar-brand p-0" style="width: 42px;" href="#"><img class="logoGiuCake w-100"
                        src="../img/logoGiuCake.svg" alt="Logo GiuCake"></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse ms-4" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-2">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="sobre.html">Sobre</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="produtos.html">Cardápio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="contato.html">Contato</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="carrinho.html">Carrinho</a>
                        </li>

                        <!-- botão (mobile) -->
                        <li class="nav-item d-lg-none">
                            <a class="nav-link" href="login.html">Conta</a>
                        </li>
                    </ul>

                    <!-- botão (desktop) -->
                    <ul class="navbar-nav mb-2 mb-lg-0 text-start align-items-lg-center">
                        <li class="nav-item">
                            <a class="nav-link d-flex align-items-center gap-2" href="#">
                                <label id="nomeDoModo" class="form-check-label" for="modo-noturno">Modo claro</label>
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" role="switch" id="modo-noturno">
                                </div>
                            </a>
                        </li>
                        <li class="nav-item nav-item d-none d-lg-block">
                            <a class="personIcon" href="login.html">
                                <i class="bi bi-person-circle person-circle personIcon" style="font-size: 32px;"></i>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section>
            <div class="fundo-produto">
                <div class="meio-circulo"></div>
                <div class="fundo-meio-circulo"></div>
            </div>

            <div class="espaco">
                <div class="d-flex align-items-end justify-content-start produto-header">
                    <p class="preco">R$ <span id="preco"></span></p>

                    <div class="circulo2 centralizar"></div>

                    <div class="carrinho d-flex align-items-center gap-2 centralizar2 pb-2">
                        <button class="btn-menos menosMais border-0">-</button>
                        <div id="numero">1</div>
                        <button class="btn-mais menosMais border-0">+</button>
                    </div>
                </div>

                <div class="d-flex flex-column align-items-center justify-content-center produto-body mt-3">
                    <span class="tipo"><span id="tipo"></span></span>
                    <h1 class="nome"><span id="nome"></span></h1>
                    <p class="descricao my-3"><span id="descricao"></span></p>
                    <a href="carrinho.html" class="btn btn-danger btn-destaque rounded-0 px-4" type="submit">Adicionar ao
                        Carrinho</a>

                    <span class="d-none" id="sabor"></span>
                </div>
            </div>
        </section>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        fetch("../produtos.json")
            .then(res => res.json())
            .then(produtos => {
                const produto = produtos[id];
                if (produto) {
                    document.getElementById("nome").textContent = produto.nome;
                    document.getElementById("tipo").textContent = produto.tipo;
                    document.getElementById("sabor").textContent = produto.sabor;
                    document.getElementById("descricao").textContent = produto.descricao;

                    const imgCirculo = document.querySelector(".circulo2");
                    if (imgCirculo && produto.img) {
                        imgCirculo.style.backgroundImage = `url('${produto.img}')`;
                    }
                } else {
                    //document.querySelector(".container").innerHTML = "<h2>Produto não encontrado</h2>";
                }

                console.log(produto.preco)
                const numero = document.getElementById("numero")
                let num = 1;
                let valorUni = parseFloat(produto.preco)
                console.log(valorUni)
                let valor = valorUni * num
                document.getElementById("preco").textContent = `${valor.toFixed(2).replace('.', ',')}`;


                document.querySelector(".btn-menos").addEventListener("click", () => {
                    if (num > 1) {
                        num--;
                        valor = valorUni * num;
                        numero.textContent = num;
                        document.getElementById("preco").textContent = `${valor.toFixed(2).replace('.', ',')}`;
                        shake()
                    }
                });

                document.querySelector(".btn-mais").addEventListener("click", () => {
                    if (num < 15) {
                        num++;
                        valor = valorUni * num;
                        numero.textContent = num;
                        document.getElementById("preco").textContent = `${valor.toFixed(2).replace('.', ',')}`;
                        shake()
                    }
                });

                function shake() {
                    const preco = document.querySelector('.preco');
                    preco.classList.add('shake');

                    // Remove a classe após a animação para que possa ser reutilizada
                    setTimeout(() => {
                        preco.classList.remove('shake');
                    }, 500); // Duração da animação em milissegundos
                }
            })
            .catch(err => {
                console.error("Erro ao carregar JSON:", err);
            });
    </script>

    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/modoDark.js"></script>
</body>

</html>
